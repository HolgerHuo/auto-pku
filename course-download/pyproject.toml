[project]
name = "pku-course-download"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["requests>=2.32.5", "m3u8>=6.0.0"]

[dependency-groups]
dev = ["pytest>=9.0", "cryptography>=46.0", "ruff>=0.14"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
